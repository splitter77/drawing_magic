<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="tableGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid/Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>

  <!-- Table Surface Shadow & Glow -->
  <ellipse cx="256" cy="380" rx="190" ry="32" fill="#000000" opacity="0.6"/>
  <ellipse cx="256" cy="375" rx="140" ry="16" fill="url(#tableGlow)" filter="url(#glow)"/>
  <path d="M 60 380 L 452 380" stroke="url(#tableGlow)" stroke-width="4" stroke-linecap="round"/>

  <!-- Phone placed Face Down (showing Back, Camera island, sleek edges) -->
  <g transform="translate(166, 110)">
    <!-- Glow aura -->
    <rect x="-8" y="-8" width="196" height="276" rx="36" fill="#10b981" opacity="0.25" filter="url(#glow)"/>
    
    <!-- Phone Chassis (Back view) -->
    <rect x="0" y="0" width="180" height="260" rx="30" fill="url(#phoneBody)" stroke="url(#phoneBorder)" stroke-width="3"/>
    
    <!-- Matte Glass back highlight -->
    <path d="M 20 10 L 160 10 A 20 20 0 0 1 170 30 L 170 120 L 10 240 L 10 30 A 20 20 0 0 1 20 10 Z" fill="#ffffff" opacity="0.04"/>

    <!-- Camera Island (Top Left of back) -->
    <rect x="20" y="22" width="58" height="64" rx="14" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <!-- Camera Lenses -->
    <circle cx="38" cy="40" r="9" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <circle cx="38" cy="40" r="4" fill="#38bdf8"/>
    <circle cx="38" cy="68" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="38" cy="68" r="4" fill="#6366f1"/>
    <circle cx="62" cy="54" r="5" fill="#e2e8f0" opacity="0.8"/> <!-- Flash -->

    <!-- Downward Arrow / Face-down icon in center -->
    <circle cx="90" cy="160" r="28" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2"/>
    <path d="M 90 144 L 90 174 M 79 164 L 90 176 L 101 164" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sound/Presence Waves under table contact -->
  <path d="M 196 405 C 230 415 282 415 316 405" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 170 422 C 220 435 292 435 342 422" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>
